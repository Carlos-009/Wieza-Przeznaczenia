
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wieża Przeznaczenia</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2ead3">
    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2ead3;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            margin: 15px;
            cursor: pointer;
        }

        #wynik {
            font-size: 23px;
            font-weight: bold;
            margin: 25px;
        }

        video {
    display: none;
    width: min(100%, 405px);
    max-height: 75vh;
    aspect-ratio: 9 / 16;
    object-fit: contain;
    margin: 20px auto 0;
    background: #000;
}
    video.odtwarzanie {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    aspect-ratio: auto;
    object-fit: contain;
    margin: 0;
    z-index: 9999;
    background: #000;
}
    </style>
</head>

<body>

    <h1>🏰 Wieża Przeznaczenia</h1>

    <p>Przyłóż telefon do taga NFC</p>

    <button id="skanuj">SKANUJ NFC</button>

    <div id="wynik">Oczekiwanie na tag...</div>

    <button id="odtworz" hidden>ODTWÓRZ FILM</button>

    <video id="video" controls playsinline></video>

    <script src="app.js?v=2"></script>

</body>
</html>
