
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wieża Przeznaczenia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2ead3;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            margin: 15px;
            cursor: pointer;
        }

        #wynik {
            font-size: 23px;
            font-weight: bold;
            margin: 25px;
        }

        video {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🏰 Wieża Przeznaczenia</h1>

    <p>Przyłóż telefon do taga NFC</p>

    <button id="skanuj">SKANUJ NFC</button>

    <div id="wynik">Oczekiwanie na tag...</div>

    <button id="odtworz" hidden>ODTWÓRZ FILM</button>

    <video id="video" controls playsinline></video>

    <script src="app.js"></script>

</body>
</html>
