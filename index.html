
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wieża Przeznaczenia</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#171629">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;

            background-image: url("tlo-wieza.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #171629;
        }

        #ekran-startowy {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #skanuj {
            font-family: Georgia, serif;
            font-size: clamp(19px, 5vw, 26px);
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff0bd;

            background: linear-gradient(
                145deg,
                rgba(75, 48, 91, 0.94),
                rgba(30, 22, 49, 0.96)
            );

            border: 3px solid #e8bd63;
            border-radius: 16px;

            padding: 19px 30px;
            min-width: 250px;

            box-shadow:
                0 0 12px #e8bd63,
                0 0 28px rgba(232, 189, 99, 0.55),
                inset 0 0 12px rgba(255, 230, 170, 0.2);

            text-shadow: 0 2px 5px #000;
            cursor: pointer;
        }

        #skanuj:active {
            transform: scale(0.96);
        }

        #wynik {
            color: #fff0bd;
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: bold;
            margin-top: 22px;
            padding: 10px 16px;
            max-width: 90%;

            background: rgba(20, 15, 35, 0.78);
            border: 1px solid rgba(232, 189, 99, 0.7);
            border-radius: 12px;
            text-shadow: 0 2px 4px #000;
        }

        #odtworz {
            display: none;
        }

        video {
            display: none;
            width: min(100%, 405px);
            max-height: 75vh;
            aspect-ratio: 9 / 16;
            object-fit: contain;
            margin: 20px auto 0;
            background: #000;
        }

        video.odtwarzanie {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-height: none;
            aspect-ratio: auto;
            object-fit: contain;
            margin: 0;
            z-index: 9999;
            background: #000;
        }
    </style>
</head>

<body>

    <div id="ekran-startowy">

        <button id="skanuj">✦ ROZPOCZNIJ GRĘ ✦</button>

        <div id="wynik">
            Dotknij przycisku, aby rozpocząć przygodę
        </div>

    </div>

    <button id="odtworz" hidden>ODTWÓRZ FILM</button>

    <video id="video" controls playsinline></video>

    <script src="app.js?v=2"></script>

</body>
</html>
