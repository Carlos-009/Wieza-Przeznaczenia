
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wieża Przeznaczenia</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#171629">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: #171629;
            color: #fff0bd;
        }

        .ekran {
            position: fixed;
            inset: 0;
            display: none;
            overflow-y: auto;
            text-align: center;
            padding: 25px 18px;
        }

        .aktywny {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #menu {
            justify-content: center;
            background-image: url("tlo-wieza.jpg");
            background-size: cover;
            background-position: center;
        }

        h1 {
            color: #ffe5a0;
            text-shadow: 0 2px 8px #000;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .menu-przycisk {
            width: min(90%, 340px);
            padding: 17px 12px;
            margin: 7px;
            border: 2px solid #e8bd63;
            border-radius: 14px;
            background: linear-gradient(145deg, #493052, #20172f);
            color: #fff0bd;
            font-family: Georgia, serif;
            font-size: 21px;
            font-weight: bold;
            text-shadow: 0 2px 4px #000;
            box-shadow: 0 0 14px rgba(232,189,99,0.45);
            cursor: pointer;
        }

        .menu-przycisk:active {
            transform: scale(0.97);
        }

        .maly-przycisk {
            padding: 12px 22px;
            margin: 12px;
            border: 2px solid #e8bd63;
            border-radius: 12px;
            background: #30213e;
            color: #fff0bd;
            font-family: Georgia, serif;
            font-size: 17px;
        }

        .panel {
            width: min(100%, 500px);
            margin: auto;
            padding: 20px;
            background: rgba(25, 18, 35, 0.94);
            border: 2px solid #c99d4e;
            border-radius: 16px;
        }

        #widok-instrukcji {
            padding: 0;
            background: #171629;
        }

        #obraz-instrukcji {
            display: block;
            width: 100%;
            height: auto;
        }

        #naglowek-instrukcji {
            position: sticky;
            top: 0;
            z-index: 2;
            width: 100%;
            padding: 10px;
            background: #241832;
            border-bottom: 1px solid #c99d4e;
        }

        #ekran-gry {
            justify-content: center;
            background: rgba(20, 15, 35, 0.94);
        }

        #wynik {
            font-size: 20px;
            font-weight: bold;
            margin: 20px auto;
            padding: 15px;
            max-width: 95%;
            background: rgba(20, 15, 35, 0.85);
            border: 1px solid #c99d4e;
            border-radius: 12px;
        }

        #video {
            display: none;
            background: #000;
        }

        #video.odtwarzanie {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-height: none;
            object-fit: contain;
            margin: 0;
            z-index: 9999;
        }

        #wlacz-dzwiek {
            display: none;
            position: fixed;
            z-index: 10001;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
        }

        select {
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            margin: 12px;
        }
    </style>
</head>

<body>

    <section id="menu" class="ekran aktywny">
    
        <button class="menu-przycisk" id="rozpocznij">
            ⚔️ ROZPOCZNIJ GRĘ
        </button>

        <button class="menu-przycisk" id="pokaz-intro">
            🎬 INTRO
        </button>

        <button class="menu-przycisk" id="pokaz-instrukcje">
            📖 INSTRUKCJA
        </button>

        <button class="menu-przycisk" id="pokaz-o-grze">
            🏰 O GRZE
        </button>

        <button class="menu-przycisk" id="pokaz-ustawienia">
            ⚙️ USTAWIENIA
        </button>
    </section>

    <section id="widok-instrukcji" class="ekran">
        <div id="naglowek-instrukcji">
            <button class="maly-przycisk" id="powrot-instrukcja">
                ← POWRÓT DO MENU
            </button>
        </div>
        <img id="obraz-instrukcji"
             src="instrukcja.jpg"
             alt="Instrukcja gry">
    </section>

    <section id="widok-ogra" class="ekran">
        <div class="panel">
            <h1>🏰 O GRZE</h1>
            <p>
                Witaj w świecie Wieży Przeznaczenia!
            </p>
            <p>
                Czeka Cię niezwykła przygoda pełna tajemnic,
                wyzwań, skarbów i niespodzianek.
            </p>
            <button class="maly-przycisk" id="powrot-o-grze">
                ← POWRÓT DO MENU
            </button>
        </div>
    </section>

    <section id="widok-ustawien" class="ekran">
        <div class="panel">
            <h1>⚙️ USTAWIENIA</h1>
            <p>Wybór języka:</p>
            <select id="jezyk">
                <option value="pl">Polski</option>
                <option value="en" disabled>English – wkrótce</option>
            </select>
            <p>Więcej ustawień pojawi się w kolejnych wersjach.</p>
            <button class="maly-przycisk" id="powrot-ustawienia">
                ← POWRÓT DO MENU
            </button>
        </div>
    </section>

    <section id="ekran-gry" class="ekran">
        <div class="panel">
            <h1>⚔️ ROZGRYWKA</h1>
            <div id="wynik">Przyłóż tag NFC</div>
            <button class="menu-przycisk" id="skanuj">
                📡 AKTYWUJ NFC
            </button>
            <button class="maly-przycisk" id="powrot-menu">
                ← POWRÓT DO MENU
            </button>
        </div>
    </section>

    <video id="video" controls playsinline></video>

    <button class="maly-przycisk" id="wlacz-dzwiek">
        🔊 WŁĄCZ DŹWIĘK
    </button>

    <script src="app.js?v=3"></script>

</body>
</html>
